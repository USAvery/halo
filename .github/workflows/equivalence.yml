name: Equivalence Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'kb.json'
      - 'tools/equivalence/**'
      # The raw-XBE oracle's authorities. function_bounds.json decides where
      # every oracle function starts and ends and xbe_reference.py reads it,
      # so a change to either changes every verdict -- but neither is under
      # tools/equivalence/, so without these lines editing the oracle's bounds
      # would not even trigger this workflow.
      - 'tools/verify/function_bounds.json'
      - 'tools/verify/xbe_reference.py'
  pull_request:
    paths:
      - 'src/**'
      - 'kb.json'
      - 'tools/equivalence/**'
      - 'tools/verify/function_bounds.json'
      - 'tools/verify/xbe_reference.py'
  schedule:
    # Nightly at 00:00 UTC (midnight). This is the first nightly job; the
    # Progress Report workflow chains off this run's completion (workflow_run)
    # because it reads the artifacts/batch_verify/summary.json produced here.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode'
        required: false
        default: 'batch'
        type: choice
        options:
          - regression
          - batch
          - discover

env:
  VENV_PYTHON: /mnt/g/dev/halo/.venv/bin/python3
  DELINKED_DIR: /mnt/g/dev/halo/delinked
  XBE_DIR: /mnt/g/dev/halo/halo-patched
  # Directory holding the (host-only, never-committed) .halorec recordings.
  # build_host_snapshots.py reads this; if absent, snapshot-dependent targets SKIP.
  HALO_HALOREC_DIR: /mnt/g/dev/halo-memory-viewer

jobs:
  regression:
    name: Unicorn regression (quick)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Link local assets
        run: |
          # Replace the checkout directories rather than nesting a
          # delinked/delinked link.  halo-patched is REQUIRED (it carries the
          # pristine cachebeta.xbe the oracle reads); delinked is optional
          # since the default oracle became the raw XBE, and is linked only so
          # an explicit --oracle=delinked run can still reproduce a
          # pre-migration verdict.
          rm -rf -- delinked halo-patched
          ln -sf ${{ env.XBE_DIR }} halo-patched
          if [ -d "${{ env.DELINKED_DIR }}" ]; then
            ln -sf ${{ env.DELINKED_DIR }} delinked
          else
            echo "::notice::no delinked/ on this runner; the raw-XBE oracle "\
                 "does not need it"
          fi

      - name: Build PR candidate
        run: |
          cmake -Bbuild -S. -DCMAKE_TOOLCHAIN_FILE=toolchains/llvm.cmake
          ${{ env.VENV_PYTHON }} tools/build/build.py -q --target halo
        timeout-minutes: 20

      - name: Build host snapshots (copyrighted game memory stays host-only)
        run: ${{ env.VENV_PYTHON }} tools/equivalence/build_host_snapshots.py

      - name: Verify prerequisites
        run: |
          ${{ env.VENV_PYTHON }} -c "import unicorn, capstone; print('ok')"
          test -f halo-patched/cachebeta.xbe
          test -f build/halo
          # The load-bearing check of the whole lane.  The oracle must read the
          # PRISTINE cachebeta.xbe; loading the PATCHED default.xbe would make
          # oracle == candidate in every region already ported and pass
          # everything silently.  Verified here as well as at run time
          # (xbe_image.assert_pristine) so a wrong image fails the job with a
          # readable message instead of 5000 suspiciously green verdicts.
          echo "c7869590a1c64ad034e49a5ee0c02465  halo-patched/cachebeta.xbe" \
            | md5sum -c -
          test -f tools/verify/function_bounds.json
          ${{ env.VENV_PYTHON }} - <<'PY'
          import json
          meta = json.load(open("tools/verify/function_bounds.json")).get("_meta", {})
          assert meta.get("xbe_md5") == "c7869590a1c64ad034e49a5ee0c02465", meta
          print(f"bounds table: {meta.get('entries')} entries, md5 matches")
          PY


      - name: Run regression tests
        run: |
          set +e
          OUTPUT=$(${{ env.VENV_PYTHON }} tools/equivalence/regression_test.py --quick 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -ne 0 ]; then
            printf '## ❌ Regression Tests Failed\n\n```\n%s\n```\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            SUMMARY_LINE=$(echo "$OUTPUT" | grep "^Done in")
            printf '## ✅ Regression Tests\n\n```\n%s\n```\n' "$SUMMARY_LINE" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $RC

  batch-verify:
    name: Batch equivalence (${{ github.event.inputs.mode || 'batch' }})
    runs-on: self-hosted
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch')
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Link local assets
        run: |
          # See the regression job: a directory target would otherwise create
          # a nested symlink instead of exposing the host-only references.
          rm -rf -- delinked halo-patched
          ln -sf ${{ env.XBE_DIR }} halo-patched
          if [ -d "${{ env.DELINKED_DIR }}" ]; then
            ln -sf ${{ env.DELINKED_DIR }} delinked
          fi

      - name: Build PR candidate
        run: |
          cmake -Bbuild -S. -DCMAKE_TOOLCHAIN_FILE=toolchains/llvm.cmake
          ${{ env.VENV_PYTHON }} tools/build/build.py -q --target halo
        timeout-minutes: 20

      - name: Verify prerequisites
        run: |
          ${{ env.VENV_PYTHON }} -c "import unicorn, capstone, z3; print('ok')"
          which llvm-objdump
          test -f halo-patched/cachebeta.xbe
          test -f build/halo
          # The load-bearing check of the whole lane.  The oracle must read the
          # PRISTINE cachebeta.xbe; loading the PATCHED default.xbe would make
          # oracle == candidate in every region already ported and pass
          # everything silently.  Verified here as well as at run time
          # (xbe_image.assert_pristine) so a wrong image fails the job with a
          # readable message instead of 5000 suspiciously green verdicts.
          echo "c7869590a1c64ad034e49a5ee0c02465  halo-patched/cachebeta.xbe" \
            | md5sum -c -
          test -f tools/verify/function_bounds.json
          ${{ env.VENV_PYTHON }} - <<'PY'
          import json
          meta = json.load(open("tools/verify/function_bounds.json")).get("_meta", {})
          assert meta.get("xbe_md5") == "c7869590a1c64ad034e49a5ee0c02465", meta
          print(f"bounds table: {meta.get('entries')} entries, md5 matches")
          PY


      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'batch' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          EXTRA_FLAGS=""
          # Nightly runs include newly ported functions an oracle can be
          # built for. Manual batch mode remains cache-focused; use discover
          # explicitly when you want the same queue outside the schedule.
          if [ "$MODE" = "discover" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            # --max-new-per-run is not optional here.  Discovery under the
            # raw-XBE oracle offers every address with a committed bound
            # instead of only the locally delinked objects, so an uncapped
            # cold run would dispatch thousands of fresh targets into a
            # 105-minute budget and time out with most of them unmeasured.
            # Reused results are free and are not counted against the cap, so
            # the corpus grows ~150 functions a night and then holds.
            EXTRA_FLAGS="--discover --max-new-per-run 150"
          fi
          echo "extra_flags=$EXTRA_FLAGS" >> "$GITHUB_OUTPUT"

      # The baseline is the COMMITTED, reviewed set of known divergences --
      # not the cached previous summary. A cached summary from a run that
      # introduced a regression would enter the baseline automatically and
      # bless that regression as "known"; requiring a commit (via
      # tools/equivalence/freeze_batch_baseline.py) keeps a human in the loop.
      - name: Load committed baseline
        id: baseline
        run: |
          BASELINE=""
          if [ -f tools/equivalence/batch_verify_baseline.json ]; then
            BASELINE="--baseline tools/equivalence/batch_verify_baseline.json"
          else
            echo "::warning::no committed baseline; --fail-on-new would treat every failure as new"
          fi
          echo "flags=$BASELINE" >> "$GITHUB_OUTPUT"

      # Correctness-safe reuse: exact-key only (no restore-keys), so per-function
      # results are reused ONLY when kb.json + src + the equivalence harness are
      # byte-identical to the run that produced them. Any change busts the cache
      # and forces a fresh recompute (which fits the budget via --jobs), so a
      # changed function never keeps a stale verdict. Survives the checkout
      # git-clean that otherwise wipes the gitignored artifacts/batch_verify/*.json.
      - name: Restore batch-verify result cache
        uses: actions/cache@v4
        with:
          path: artifacts/batch_verify
          # function_bounds.json and xbe_reference.py are in the key for the
          # same reason they are in `paths:`: they decide every oracle's
          # extent. Outside the key, editing the bounds table would leave
          # every function holding a verdict measured against a different
          # oracle.
          key: batch-verify-${{ hashFiles('kb.json', 'src/**', 'tools/equivalence/**', 'tools/verify/function_bounds.json', 'tools/verify/xbe_reference.py') }}

      # No continue-on-error: with --fail-on-new the job fails ONLY on a
      # divergence absent from the committed baseline, so a red run now means
      # something actually regressed. Before this, the step could not fail at
      # all, so the nightly reported green through any regression.
      - name: Run batch verification
        env:
          # 10 workers on the 16-core self-hosted box. A sweep is startup-bound,
          # not compute-bound, so it scales nearly linearly with --jobs (80
          # targets: 123 s at -j3, 54 s at -j10) and -j3 left 13 cores idle.
          #
          # jobs * limit is NOT the expected footprint -- the limit is a
          # watchdog for a runaway --mem-trace, and measured peak across every
          # child of a -j8 run was 1.17 GB TOTAL (~70 MB each). 2 GB per child
          # still fires long before a leak can reach the host's 15 GB.
          HALO_EQUIV_MEM_LIMIT_GB: "2"
        run: |
          # timeout 120 (not lower): --jobs parallelism alone brings a cold run to
          # ~40 min, far under the 105-min wall budget, so the per-function ceiling
          # can stay generous. A shorter ceiling manufactures false "timeout"
          # failures on legitimately slow-but-passing functions (e.g. actor_delete
          # passes at 120 s). --max-wall-minutes is the real hard stop.
          ${{ env.VENV_PYTHON }} tools/equivalence/batch_verify.py \
            --seeds 50 \
            --timeout 120 \
            --jobs 10 \
            --max-wall-minutes 105 \
            --csv \
            --skip-existing \
            --allowlist tools/equivalence/batch_verify_allowlist.json \
            --skip-allowlisted \
            --max-age-hours 168 \
            --fail-on-new \
            ${{ steps.mode.outputs.extra_flags }} \
            ${{ steps.baseline.outputs.flags }} \
            --output-dir artifacts/batch_verify

      - name: Generate progress dashboard
        if: always()
        run: |
          mkdir -p artifacts/progress
          ${{ env.VENV_PYTHON }} tools/report/generate_decomp_report.py \
            --output artifacts/progress/report.json \
            --html artifacts/progress/index.html

      - name: Update historical data
        if: always()
        run: |
          ${{ env.VENV_PYTHON }} tools/report/history.py \
            --add-snapshot artifacts/progress/report.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-results-${{ github.run_number }}
          path: |
            artifacts/batch_verify/
            artifacts/progress/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          if [ -f artifacts/batch_verify/summary.json ]; then
            ${{ env.VENV_PYTHON }} -c "
          import json, sys
          s = json.load(open('artifacts/batch_verify/summary.json'))
          r = s['results']
          elapsed = s.get('elapsed_seconds', 0)
          print('## Equivalence Test Results')
          print()
          print(f'| Metric | Count |')
          print(f'|--------|-------|')
          print(f'| Fresh executions | {s.get(\"fresh_executions\", 0)} |')
          print(f'| Reused results | {s.get(\"reused_results\", 0)} |')
          print(f'| Stale invalidated | {s.get(\"stale_or_invalidated_results\", 0)} |')
          print(f'| Newly discovered | {s.get(\"discovered_candidates\", 0)} |')
          print(f'| Total candidates | {r[\"total\"]} |')
          print(f'| Pass | {r[\"pass\"]} |')
          print(f'| Fail | {r[\"fail\"]} |')
          print(f'| Error | {r[\"error\"]} |')
          print(f'| Z3 proven | {r[\"z3_proven\"]} |')
          print(f'| Elapsed | {elapsed:.0f}s |')
          if r[\"total\"] and s.get(\"fresh_executions\", 0) == 0:
              print()
              print('> WARNING: this batch executed no candidates; all results were reused.')
          if s.get('comparison', {}).get('new_failures'):
              print()
              print('### New Failures (regressions)')
              for f in s['comparison']['new_failures']:
                  nm = f['name']; obj = f['obj']; rsn = f['reason']
                  ed = f.get('error_details', [])
                  print('- **' + nm + '** (' + obj + '): ' + rsn)
                  if ed and rsn in ('emulation_error', 'timeout'):
                      for d in ed[:5]:
                          print('  - `' + d + '`')
                      if len(ed) > 5:
                          print('  - *... and ' + str(len(ed)-5) + ' more*')
          if s.get('comparison', {}).get('known_failures'):
              print()
              print('### Known Failures (cont.)')
              for f in s['comparison']['known_failures']:
                  nm = f['name']; obj = f['obj']; rsn = f['reason']
                  ed = f.get('error_details', [])
                  print('- **' + nm + '** (' + obj + '): ' + rsn)
                  if ed and rsn in ('emulation_error', 'timeout'):
                      for d in ed[:3]:
                          print('  - `' + d + '`')
          " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Triage failures
        if: always()
        run: |
          if [ -f artifacts/batch_verify/summary.json ]; then
            {
              echo "## Failure Triage (auto-classified)"
              echo '```'
              ${{ env.VENV_PYTHON }} tools/equivalence/triage_failures.py \
                --summary-path artifacts/batch_verify/summary.json \
                --details 2>&1 || echo "(triage_failures produced no output)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
